[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "unionllm"
version = "0.3.0"
description = "A Python library for unified access to all kinds of large language models."
license = "MIT"
homepage = "https://github.com/EvalsOne/UnionLLM"
repository = "https://github.com/EvalsOne/UnionLLM"
documentation = "https://github.com/EvalsOne/UnionLLM/tree/main/docs"
authors = ["evalsone <contact@evalsone.com>"]
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "claude", "gemini", "azure", "deepseek", "qwen", "zhipu", "kimi"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
dashscope = "*"
openai = "*"
pydantic = "*"
requests = "*"
tenacity = "*"
websocket-client = "*"
anthropic = "*"
google-genai = "*"
azure-identity = "*"
pillow = "*"
# Optional: only the long-tail providers routed through LiteLLM need it.
# LiteLLM still requires openai<3, so it cannot be installed with openai 3.x.
litellm = { version = ">=1.75,<1.95", optional = true }

[tool.poetry.extras]
litellm = ["litellm"]

[tool.poetry.urls]
Changelog = "https://github.com/EvalsOne/UnionLLM/blob/main/CHANGELOG.md"
Issues = "https://github.com/EvalsOne/UnionLLM/issues"
