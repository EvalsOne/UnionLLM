[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "unionllm"
version = "0.3.0"
description = "A Python library for unified access to all kinds of large language models."
license = "MIT"
homepage = "https://github.com/EvalsOne/UnionLLM"
authors = ["evalsone <contact@evalsone.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
dashscope = "*"
openai = "*"
pydantic = "*"
requests = "*"
tenacity = "*"
websocket-client = "*"
anthropic = "*"
google-genai = "*"
azure-identity = "*"
pillow = "*"
# Optional: only the long-tail providers routed through LiteLLM need it.
# LiteLLM still requires openai<3, so it cannot be installed with openai 3.x.
litellm = { version = ">=1.75,<1.95", optional = true }

[tool.poetry.extras]
litellm = ["litellm"]
