[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "unionllm"
version = "0.2.14"
description = "A Python library for unified access to all kinds of large language models."
license = "MIT"
homepage = "https://github.com/EvalsOne/UnionLLM"
authors = ["evalsone <contact@evalsone.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
dashscope = "*"
openai = "*"
pydantic = "*"
requests = "*"
tenacity = "*"
websocket-client = "*"
litellm = ">=1.75,<1.95"
anthropic = "*"
google-genai = "*"
azure-identity = "*"
pillow = "*"
